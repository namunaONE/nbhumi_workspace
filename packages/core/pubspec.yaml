name: core
description: Core theme, utilities, errors and shared components for nBhumi
publish_to: none
resolution: workspace
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  intl: ^0.20.3
  # Shared components render domain models (ListingCard takes a ListingSummary).
  # No cycle: models depends on nothing in this workspace.
  models:
    path: ../models

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0