name: models
description: Shared data models for nBhumi
publish_to: none
resolution: workspace
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  # `listEquals`, for QueuePage equality. Dart's own `package:collection` rather
  # than `package:flutter/foundation`: models is the base of the graph
  # and has no Flutter dependency, deliberately — it is consumed by the data
  # package, the features and both apps, and adding Flutter here would make it
  # unusable from a plain Dart test or a future CLI. `collection` is a
  # first-party Dart package with no transitive weight.
  collection: ^1.19.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  build_runner: ^2.16.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.0
  json_serializable: ^6.14.0
  very_good_analysis: ^11.0.0
