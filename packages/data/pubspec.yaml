name: data
description: Data layer — repositories, services, and Supabase client for nBhumi
publish_to: none
resolution: workspace
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  core:
    path: ../core
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  models:
    path: ../models
  riverpod_annotation: ^4.0.0
  supabase_flutter: ^2.6.0

dev_dependencies:
  build_runner: ^2.16.0
  flutter_test:
    sdk: flutter
  # `http` for the injected BaseClient in kyc_repository_test.dart. Testing the
  # error-mapping path through a real http.Client (rather than a hand-built fake
  # client object) is what makes the test assert on the exception shape the SDK
  # actually produces. Already a transitive dependency via supabase_flutter, so
  # this adds no new package to the graph - it just names it.
  http: ^1.6.0
  riverpod_generator: ^4.0.0
  very_good_analysis: ^11.0.0