<!DOCTYPE html>
<html>
<head>
  <!--
    Base href placeholder — replaced by flutter build. Change the href value
    below if serving from a sub-path other than root.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- SEO / share -->
  <meta name="description"
         content="nBhumi — Nepal's Property Marketplace. Buy, sell and rent land, houses and apartments across Kathmandu, Pokhara and all of Nepal.">
  <meta property="og:title" content="nBhumi — Nepal Property Marketplace">
  <meta property="og:description" content="Buy, sell and rent property across Nepal.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:type" content="website">

  <!-- PWA / mobile -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Theme colour matches BrandColors.logoBlue (#002C6D) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="nBhumi">
  <meta name="theme-color" content="#002C6D">

  <title>nBhumi — Nepal Property Marketplace</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <!--
    Security headers expressible as <meta> only.

    GitHub Pages serves no custom HTTP headers, so this is the only layer
    available here — and it is deliberately partial. X-Frame-Options as a meta
    tag is advisory (ignored by some browsers, overridable intra-page) and is
    NOT a substitute for the CSP header that a real host can set.

    No Content-Security-Policy is declared, on purpose. Flutter's CanvasKit
    renderer requires script-src 'wasm-unsafe-eval' plus
    https://www.gstatic.com/flutter-canvaskit/ and style-src 'unsafe-inline';
    a nonce-based CSP breaks the app outright (flutter/flutter#86553). A policy
    loose enough to admit CanvasKit stops being a control, and shipping one
    would misrepresent the app's posture. The real boundary is Supabase RLS,
    which is enforced server-side and is unaffected by what this host can send.

    COOP/COEP are absent for the same reason: Pages cannot set them, which is
    why the --wasm / skwasm renderer is not usable until the move to Vercel.
  -->
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="referrer" content="strict-origin-when-cross-origin">

  <!--
    A preview must never be indexed. robots.txt alone is a request; this is the
    directive. Belt and braces, because a stray inbound link should not surface
    a demo build as if it were the marketplace.
  -->
  <meta name="robots" content="noindex, nofollow">
</head>
<body>
  <!--
    Pre-paint preview marker.

    CanvasKit downloads ~1.5MB before the first frame, so a tester would
    otherwise stare at 1-2s of blank canvas with nothing to identify the build.
    This strip is pure HTML/CSS so it paints instantly, then hands off to the
    Flutter PreviewBanner on `flutter-first-frame` — the documented handoff
    event. It never navigates or dismisses anything app-side.

    Styled inline rather than via a stylesheet because GitHub Pages serves no
    headers and a one-rule external file is a request that can 404.
  -->
  <div id="preview-banner"
       style="position:fixed;top:0;left:0;right:0;z-index:2147483647;
              background:#002C6D;color:#fff;text-align:center;
              font:600 13px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
              padding:6px 12px;letter-spacing:.2px;">
    Preview build — not the live marketplace · पूर्वावलोकन निर्माण — प्रत्यक्ष बजार होइन
  </div>
  <script>
    // Hand off to the in-app banner once Flutter has actually painted, so the
    // two never show at once. If Flutter never boots, the strip stays: an
    // unlabelled page is worse than a stale one.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('preview-banner');
      if (el) { el.remove(); }
    });
    // Flutter's loader also emits `load` on the bootstrap; the first-frame
    // listener above is the authoritative signal, this is only a backstop for
    // builds where the event name changed.
    setTimeout(function () {
      var el = document.getElementById('preview-banner');
      if (el && document.querySelector('flt-glass-pane')) { el.remove(); }
    }, 8000);
  </script>

  <script src="flutter_bootstrap.js" async></script>

  <!--
    Service worker registration for PWA offline-first support.
    The worker itself is generated by `flutter build web --pwa-strategy`.

    A bare relative path, not `$FLUTTER_BASE_HREF + name`: with the default
    base href "/" that interpolation yields "//flutter_service_worker.js", a
    protocol-relative URL that resolves against the current scheme's host
    rather than this app. Relative resolution against <base> is correct for
    every base-href value.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker
            .register('flutter_service_worker.js')
            .then(function (reg) { console.log('SW registered:', reg.scope); })
            .catch(function (err) { console.log('SW registration failed:', err); });
      });
    }
  </script>
</body>
</html>
