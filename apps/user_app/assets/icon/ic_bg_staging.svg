<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="iconBgStaging" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B45309"/>
      <stop offset="1" stop-color="#78350A"/>
    </linearGradient>
  </defs>

  <!-- Staging flavor background: amber signals pre-production caution, the
       same way amber means "not yet" everywhere else in the UI. Full-bleed;
       the OS mask rounds the corners. -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#iconBgStaging)"/>
</svg>
