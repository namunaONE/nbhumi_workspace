<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B3F94"/>
      <stop offset="1" stop-color="#002C6D"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background. Square corners on purpose: the OS launcher
       mask (circle / squircle / teardrop) rounds them. Pre-rounded corners
       here would double-round under some masks. -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#iconBg)"/>
</svg>
