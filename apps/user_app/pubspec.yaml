name: user_app
description: nBhumi user-facing mobile app (Nepal Property Marketplace)
publish_to: none
resolution: workspace
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  app_links: ^7.0.0
  auth:
    path: ../../features/auth
  core:
    path: ../../packages/core
  data:
    path: ../../packages/data
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.6
  flutter_riverpod: ^3.0.0
  go_router: ^14.2.0
  intl: ^0.20.3
  kyc:
    path: ../../features/kyc
  listing_detail:
    path: ../../features/listing_detail
  lottie: ^3.1.2
  models:
    path: ../../packages/models
  notifications:
    path: ../../features/notifications
  post_listing:
    path: ../../features/post_listing
  search:
    path: ../../features/search
  shared_preferences: ^2.3.3
  supabase_flutter: ^2.6.0

dev_dependencies:
  # Golden screenshot tests (HYA-267): alchemist over golden_toolkit because
  # the latter is abandoned (no release in years) while alchemist is the
  # maintained successor (VGV/Betterment, 150 pub points, Mar 2026). CI-mode
  # goldens use the Ahem font so results are platform-independent.
  alchemist: ^0.14.0
  flutter_launcher_icons: ^0.13.0
  flutter_test:
    sdk: flutter
  # Referenced by test/flutter_test_config.dart (font-fetch kill switch).
  # Test-only use; the app itself gets the typeface through core's theme.
  google_fonts: ^6.3.3
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/animations/

# Launcher icons from the logo SVG (assets/icon/*.svg are the source of
# truth; PNGs are rendered from them). flutter_launcher_icons consumes the
# PNGs: full-bleed composite for legacy/iOS, split layers for adaptive.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/ic_full_1024.png"
  adaptive_icon_foreground: "assets/icon/ic_fg.png"
  adaptive_icon_background: "assets/icon/ic_bg.png"
  remove_alpha_ios: true

# Splash screen from the logo (brand blue + glyph). flutter_native_splash
# consumes the same split assets: solid brand background, transparent glyph
# centered on top. Regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  android: true
  ios: true
  web: false
  color: "#002C6D"
  color_dark: "#002C6D"
  image: assets/icon/ic_fg.png
  image_dark: assets/icon/ic_fg.png
  android_12:
    color: "#002C6D"
    image: assets/icon/ic_fg.png