name: Release APK

# Publishes APKs to GitHub Releases.
# - On v* tag push: creates Release (signed if keystore secrets exist, else unsigned)
# - On manual dispatch: same, with version input
# - Test tags (v0.*) create DRAFT releases for verification

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.2.3)'
        required: true
        type: string

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  build-and-release:
    name: Build APKs & create Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: dart pub get

      - name: Decode keystore & write Gradle properties (if secrets provided)
        # Only runs if KEYSTORE_BASE64 secret exists and is non-empty.
        # Uses env var indirection to avoid expression parser errors when secret is missing.
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > apps/user_app/android/app/release-keystore.jks
          cat <<EOF > apps/user_app/android/key.properties
          releaseKeystoreFile=apps/user_app/android/app/release-keystore.jks
          releaseKeystorePassword=$KEYSTORE_PASSWORD
          releaseKeyAlias=$KEY_ALIAS
          releaseKeyPassword=$KEY_PASSWORD
          EOF

      - name: Build dev APK (debug, unsigned)
        working-directory: apps/user_app
        run: |
          flutter build apk --flavor dev --debug \
            --dart-define=ENVIRONMENT=dev
        env:
          ENVIRONMENT: dev

      - name: Build prod APK (release — signed if keystore provided, else debug-signed)
        working-directory: apps/user_app
        run: |
          flutter build apk --flavor prod --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=ENVIRONMENT=prod

      - name: Determine version & release type
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Test tags (v0.*) → draft prerelease; others → full release
          if [[ "$VERSION" =~ ^0\. ]]; then
            echo "draft=true" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "name_suffix= (TEST BUILD)" >> $GITHUB_OUTPUT
          else
            echo "draft=false" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "name_suffix=" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: nBhumi v${{ steps.meta.outputs.version }}${{ steps.meta.outputs.name_suffix }}
          draft: ${{ steps.meta.outputs.draft }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            apps/user_app/build/app/outputs/flutter-apk/app-prod-release.apk
            apps/user_app/build/app/outputs/flutter-apk/app-dev-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload dev APK as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: user-app-dev-apk
          path: apps/user_app/build/app/outputs/flutter-apk/app-dev-debug.apk
          retention-days: 30

      - name: Upload prod APK as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: user-app-prod-apk
          path: apps/user_app/build/app/outputs/flutter-apk/app-prod-release.apk
          retention-days: 30