name: Release APK

# Publishes signed APKs to GitHub Releases on version tag push.
# Usage: tag a commit with v1.2.3 (semver) and push: `git tag v1.2.3 && git push origin v1.2.3`
# Also runnable manually from the Actions tab with a version input.

on:
  push:
    tags:
      - 'v*'  # semantic version tags
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.2.3)'
        required: true
        type: string

permissions:
  contents: write  # needed to create Release and upload assets

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  build-and-release:
    name: Build signed APKs & create Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for version parsing from tags

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: dart pub get

      - name: Decode keystore & write Gradle properties
        # Keystore stored as base64 in GitHub Secret: KEYSTORE_BASE64
        # Also requires: KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > apps/user_app/android/app/release-keystore.jks
          cat <<EOF > apps/user_app/android/key.properties
          releaseKeystoreFile=apps/user_app/android/app/release-keystore.jks
          releaseKeystorePassword=${{ secrets.KEYSTORE_PASSWORD }}
          releaseKeyAlias=${{ secrets.KEY_ALIAS }}
          releaseKeyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build dev APK (debug, unsigned)
        working-directory: apps/user_app
        run: |
          flutter build apk --flavor dev --debug \
            --dart-define=ENVIRONMENT=dev
        env:
          # No secrets needed for dev flavor
          ENVIRONMENT: dev

      - name: Build prod APK (release, signed if keystore provided)
        working-directory: apps/user_app
        run: |
          flutter build apk --flavor prod --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=ENVIRONMENT=prod
        env:
          # Passed to Gradle via key.properties (read by build.gradle.kts)
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            # strip leading 'v' from tag
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: nBhumi v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            apps/user_app/build/app/outputs/flutter-apk/app-prod-release.apk
            apps/user_app/build/app/outputs/flutter-apk/app-dev-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload dev APK as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: user-app-dev-apk
          path: apps/user_app/build/app/outputs/flutter-apk/app-dev-debug.apk
          retention-days: 30

      - name: Upload prod APK as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: user-app-prod-apk
          path: apps/user_app/build/app/outputs/flutter-apk/app-prod-release.apk
          retention-days: 30