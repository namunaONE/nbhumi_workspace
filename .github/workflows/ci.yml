name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: dart pub get

      - name: Verify codegen is up to date
        # Every package holding `@riverpod` or `@freezed` annotations must appear
        # here. Generated files are committed (Rule 14) so CI never runs codegen
        # itself, which means an unlisted package can silently drift from source.
        run: |
          cd packages/models && dart run build_runner build && cd ../..
          cd packages/data && dart run build_runner build && cd ../..
          cd features/auth && dart run build_runner build && cd ../..
          cd features/admin_queue && dart run build_runner build && cd ../..
          cd features/search && dart run build_runner build && cd ../..
          cd features/kyc && dart run build_runner build && cd ../..
          cd features/notifications && dart run build_runner build && cd ../..
          cd features/post_listing && dart run build_runner build && cd ../..
          cd features/listing_detail && dart run build_runner build && cd ../..
          git diff --exit-code || (echo "::error::Generated files are out of date. Run build_runner locally and commit the results." && exit 1)

      - name: Analyze (zero warnings)
        run: dart analyze --fatal-infos

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: dart pub get

      - name: Run tests with coverage
        run: |
          set -e
          for pkg in packages/models packages/core packages/data features/auth features/search features/listing_detail features/post_listing features/admin_queue features/kyc features/notifications apps/user_app apps/admin_panel; do
            if [ -d "$pkg/test" ]; then
              echo "::group::Testing $pkg"
              (cd "$pkg" && flutter test --coverage)
              echo "::endgroup::"
            fi
          done

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./packages/models/coverage/lcov.info,./packages/core/coverage/lcov.info,./apps/user_app/coverage/lcov.info
          fail_ci_if_error: false

  build-web:
    name: Build Admin Panel (web)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: dart pub get

      - name: Build web
        working-directory: apps/admin_panel
        # EnvConfig reads SUPABASE_PUBLISHABLE_KEY (the ANON_KEY define below
        # is legacy and read by nothing — kept so a dashboard still on the
        # old secret name does not silently fall back to the compiled-in
        # default key). TODO(HYA-239 follow-up): drop ANON_KEY once the
        # SUPABASE_PUBLISHABLE_KEY secret exists.
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=ENVIRONMENT=prod

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-panel-web
          path: apps/admin_panel/build/web
          retention-days: 7

  build-android:
    name: Build Android flavors (HYA-239)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: dart pub get

      # Dev flavor builds against compiled-in local defaults — validates the
      # flavor wiring itself without any secrets.
      - name: Build dev APK (debug)
        working-directory: apps/user_app
        run: |
          flutter build apk --flavor dev --debug \
            --dart-define=ENVIRONMENT=dev

      - name: Build prod APK (release)
        working-directory: apps/user_app
        run: |
          flutter build apk --flavor prod --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=ENVIRONMENT=prod

      - name: Upload prod APK
        uses: actions/upload-artifact@v4
        with:
          name: user-app-prod-apk
          path: apps/user_app/build/app/outputs/flutter-apk/app-prod-release.apk
          retention-days: 7
