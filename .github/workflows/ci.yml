name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  hygiene:
    name: Hygiene gates (Rules 42-46)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dead files (Rule 44)
        # .bak, debug dumps, and golden-failure artifacts are regenerable or
        # belong in the owning change under its real filename — never loose.
        # Build outputs and IDE metadata are pruned, not scanned.
        run: |
          set -e
          junk=$(find apps packages features supabase .github \( -path '*/build/*' -o -path '*/.*' \) -prune -o \( -name '*.bak' -o -name 'test_output.txt' -o -type d -path '*test/failures' \) -print 2>/dev/null | grep -v '^$' || true)
          if [ -n "$junk" ]; then
            echo "::error::Dead files present (Rule 44):"
            echo "$junk"
            exit 1
          fi
          echo "No dead files."

      - name: 300-line cap (Rule 42)
        # Generated files are exempt per Rule 14. Grandfathered violators are
        # allowlisted with their tracking issue; new files must not join them.
        run: |
          set -e
          allow='profile_screen.dart|reports_list.dart|admin_repository.dart|admin_listing_detail_screen.dart|listing_repository.dart|moderation_actions.dart|queue_list.dart|admin_queue_providers.dart|listing_report.dart|admin_queue_entry.dart|listing_wizard_provider.dart|location_step.dart|listing_card.dart|login_screen.dart|listing_detail_body.dart|listing_wizard_state.dart|filter_sheet.dart'
          viol=0
          for f in $(git ls-files 'apps/*/lib/*.dart' 'packages/*/lib/*.dart' 'features/*/lib/*.dart'); do
            case "$f" in
              *.g.dart|*.freezed.dart|*/l10n/output/*) continue;;
            esac
            if echo "$(basename "$f")" | grep -Eq "^($allow)$"; then continue; fi
            n=$(wc -l < "$f")
            if [ "$n" -gt 300 ]; then
              echo "::error file=$f::exceeds 300-line cap (Rule 42): $n lines"
              viol=1
            fi
          done
          [ "$viol" -eq 0 ]

      - name: Barrel completeness (Rule 44)
        # Every src file in packages/* must be exported from the package
        # barrel in the same change — unexported files are invisible to
        # dependents and rot (V1 precedent: listing_cache.dart). Feature
        # barrels are intentionally selective, so features are exempt.
        run: |
          set -e
          fail=0
          for pair in "packages/core:core.dart" "packages/data:data.dart" "packages/models:models.dart"; do
            pkg="${pair%%:*}"; bar="${pair##*:}"
            for src in $(git ls-files "$pkg/lib/src/"'*.dart'); do
              base=$(basename "$src")
              case "$base" in
                *.g.dart|*.freezed.dart) continue;; # codegen parts, never exported
              esac
              if ! grep -q "^export '.*$base'" "$pkg/lib/$bar"; then
                echo "::error file=$pkg/lib/$bar::Rule 44: $src not exported from barrel"
                fail=1
              fi
            done
          done
          [ "$fail" -eq 0 ]

      - name: Dependency direction (Rule 10)
        # apps -> features -> packages, one way. No package may import a
        # feature/app; no feature may import another feature; no lib/src file
        # may import its own barrel or deep-link another file via package:.
        run: |
          set -e
          feats='auth|kyc|listing_detail|notifications|post_listing|search|admin_queue'
          fail=0
          hit=$(grep -rn --include='*.dart' -E "import 'package:($feats|user_app|admin_panel)/" packages/*/lib/ || true)
          if [ -n "$hit" ]; then echo "::error::packages import features/apps (Rule 10):"; echo "$hit"; fail=1; fi
          for feat in auth kyc listing_detail notifications post_listing search admin_queue; do
            others=$(echo "auth kyc listing_detail notifications post_listing search admin_queue" | tr ' ' '\n' | grep -v "^$feat\$" | paste -sd'|')
            hit=$(grep -rn --include='*.dart' -E "import 'package:($others)/" "features/$feat/lib/" || true)
            if [ -n "$hit" ]; then echo "::error::cross-feature import (Rule 10):"; echo "$hit"; fail=1; fi
            hit=$(grep -rn --include='*.dart' "import 'package:$feat/$feat.dart'" "features/$feat/lib/src/" || true)
            if [ -n "$hit" ]; then echo "::error::self-barrel import, use relative (Rule 22):"; echo "$hit"; fail=1; fi
            hit=$(grep -rn --include='*.dart' -E "import 'package:$feat/src/" "features/$feat/lib/" || true)
            if [ -n "$hit" ]; then echo "::error::deep package self-import, use relative (Rule 22):"; echo "$hit"; fail=1; fi
          done
          [ "$fail" -eq 0 ]
          echo "Dependency direction clean."

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: dart pub get

      - name: Verify codegen is up to date
        # Every package holding `@riverpod` or `@freezed` annotations must appear
        # here. Generated files are committed (Rule 14) so CI never runs codegen
        # itself, which means an unlisted package can silently drift from source.
        run: |
          cd packages/models && dart run build_runner build && cd ../..
          cd packages/data && dart run build_runner build && cd ../..
          cd features/auth && dart run build_runner build && cd ../..
          cd features/admin_queue && dart run build_runner build && cd ../..
          cd features/search && dart run build_runner build && cd ../..
          cd features/kyc && dart run build_runner build && cd ../..
          cd features/notifications && dart run build_runner build && cd ../..
          cd features/post_listing && dart run build_runner build && cd ../..
          cd features/listing_detail && dart run build_runner build && cd ../..
          git diff --exit-code || (echo "::error::Generated files are out of date. Run build_runner locally and commit the results." && exit 1)

      - name: Analyze (zero warnings)
        run: dart analyze --fatal-infos

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: dart pub get

      - name: Run tests with coverage
        run: |
          set -e
          for pkg in packages/models packages/core packages/data features/auth features/search features/listing_detail features/post_listing features/admin_queue features/kyc features/notifications apps/user_app apps/admin_panel; do
            if [ -d "$pkg/test" ]; then
              echo "::group::Testing $pkg"
              (cd "$pkg" && flutter test --coverage)
              echo "::endgroup::"
            fi
          done

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./packages/models/coverage/lcov.info,./packages/core/coverage/lcov.info,./apps/user_app/coverage/lcov.info
          fail_ci_if_error: false

  build-web:
    name: Build Admin Panel (web)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: dart pub get

      - name: Build web
        working-directory: apps/admin_panel
        # EnvConfig reads SUPABASE_PUBLISHABLE_KEY (the ANON_KEY define below
        # is legacy and read by nothing — kept so a dashboard still on the
        # old secret name does not silently fall back to the compiled-in
        # default key). TODO(HYA-239 follow-up): drop ANON_KEY once the
        # SUPABASE_PUBLISHABLE_KEY secret exists.
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=ENVIRONMENT=prod

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-panel-web
          path: apps/admin_panel/build/web
          retention-days: 7

  build-android:
    name: Build Android flavors (HYA-239)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: dart pub get

      # Dev flavor builds against compiled-in local defaults — validates the
      # flavor wiring itself without any secrets.
      - name: Build dev APK (debug)
        working-directory: apps/user_app
        run: |
          flutter build apk --flavor dev --debug \
            --dart-define=ENVIRONMENT=dev

      - name: Build prod APK (release)
        working-directory: apps/user_app
        run: |
          flutter build apk --flavor prod --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=ENVIRONMENT=prod

      - name: Upload prod APK
        uses: actions/upload-artifact@v4
        with:
          name: user-app-prod-apk
          path: apps/user_app/build/app/outputs/flutter-apk/app-prod-release.apk
          retention-days: 7
