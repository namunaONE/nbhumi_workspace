name: notifications
description: In-app notification inbox for nBhumi (HYA-242 B3)
publish_to: none
resolution: workspace
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  core:
    path: ../../packages/core
  data:
    path: ../../packages/data
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  intl: ^0.20.3
  models:
    path: ../../packages/models
  riverpod_annotation: ^4.0.7

dev_dependencies:
  build_runner: ^2.16.0
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter
  # `http` + `supabase_flutter` for the method-aware client behind the
  # repository override in notifications_screen_test.dart. Test-only use, so
  # dev_dependencies; `http` is already transitive via supabase_flutter.
  http: ^1.6.0
  riverpod_generator: ^4.0.0
  supabase_flutter: ^2.6.0
  very_good_analysis: ^11.0.0

flutter:
  generate: true
