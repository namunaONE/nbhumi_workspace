name: admin_queue
description: Admin verification queue for nBhumi
publish_to: none
resolution: workspace
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  core:
    path: ../../packages/core
  data:
    path: ../../packages/data
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  # Annotations only. The generated code is committed (Rule 14), so `freezed` and
  # `riverpod_generator` are dev_dependencies and never reach a shipped bundle.
  # Both were declared in dev_dependencies while `freezed_annotation` and
  # `riverpod_annotation` were imported by the library, which the analyzer
  # rejects: a package cannot use an annotation it has not declared.
  freezed_annotation: ^3.1.0
  models:
    path: ../../packages/models
  riverpod_annotation: ^4.0.0

dev_dependencies:
  build_runner: ^2.16.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.0
  riverpod_generator: ^4.0.0
  very_good_analysis: ^11.0.0
