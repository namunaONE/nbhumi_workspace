name: kyc
description: Seller KYC document upload and status for nBhumi (HYA-264 Tier 2, HYA-265 Tier 3)
publish_to: none
resolution: workspace
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  core:
    path: ../../packages/core
  data:
    path: ../../packages/data
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^14.8.1
  image_picker: ^1.2.3
  intl: ^0.20.3
  models:
    path: ../../packages/models
  riverpod_annotation: ^4.0.7

dev_dependencies:
  build_runner: ^2.16.0
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.0
  # Session fakes for signed-in widget tests (HYA-265 Tier-3 submit path).
  # Already in the workspace graph via data/user_app, so no new transitive
  # weight (Rule 39); version matches data's constraint.
  supabase_flutter: ^2.6.0
  very_good_analysis: ^11.0.0

flutter:
  generate: true
